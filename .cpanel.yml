# cPanel Git Version Control deployment script.
#
# Confirmed against the real account: docroot is /home/nijiwdhp/keralafounders.eu/
# (from cPanel's Domains list) and the home directory user is nijiwdhp.
#
# IMPORTANT: each line under `tasks:` runs as its own separate shell — an
# `export` in one line does NOT carry over to the next line. Every command
# below hardcodes the full path directly instead of relying on a variable
# set in a previous line, which is what silently broke the first deploy
# (DEPLOYPATH/CONFIGPATH were empty by the time cp actually ran).
#
# What this does on every "Deploy HEAD Commit" in cPanel's Git Version Control UI:
#   - copies public/* into the live document root
#   - copies config/reference.php (the only non-secret config file) into the
#     private config/ folder that sits outside the document root
#   - deliberately leaves config/db.php and config/auth.php alone — those hold
#     real credentials, are never committed to this repo, and must already
#     exist on the server from your original manual setup.
---
deployment:
  tasks:
    - /bin/mkdir -p /home/nijiwdhp/keralafounders.eu/
    - /bin/cp -R public/. /home/nijiwdhp/keralafounders.eu/
    - /bin/mkdir -p /home/nijiwdhp/config/
    - /bin/cp config/reference.php /home/nijiwdhp/config/
