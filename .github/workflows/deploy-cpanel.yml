name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
      CPANEL_SSH_PORT: 21098
    steps:
      # cPanel's UAPI Git module (Git::update / Git::deploy) isn't installed on
      # this host (confirmed: "Can't locate Cpanel/API/Git.pm"), so this
      # replicates .cpanel.yml's deployment tasks directly over SSH instead of
      # relying on the "Update from Remote" / "Deploy HEAD Commit" API calls.
      - name: Add cPanel host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$CPANEL_SSH_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Pull latest commit and deploy over SSH
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          ssh -p "$CPANEL_SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${CPANEL_USERNAME}@${CPANEL_HOST}" bash -s -- "$CPANEL_USERNAME" "$CPANEL_REPO_ROOT" <<'REMOTE_SCRIPT'
            set -euo pipefail
            user="$1"
            repo_root="$2"
            docroot="/home/${user}/keralafounders.eu"
            cd "$repo_root"
            git pull origin main
            /bin/mkdir -p "$docroot"
            # assets/logo.svg is maintained by hand directly on the server (see
            # CLAUDE.md) — the committed copy in git is stale. Preserve whatever
            # logo is currently live across every deploy, no matter what's in git.
            logo_backup="$(mktemp)"
            /bin/cp "$docroot/assets/logo.svg" "$logo_backup" 2>/dev/null || true
            /bin/cp -R public/. "$docroot/"
            if [ -s "$logo_backup" ]; then
              /bin/cp "$logo_backup" "$docroot/assets/logo.svg"
            fi
            rm -f "$logo_backup"
            /bin/mkdir -p "/home/${user}/config/"
            /bin/cp config/reference.php "/home/${user}/config/"
          REMOTE_SCRIPT
